<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FandomVerse - Login</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="asset/css/STYLE.css">

</head>

<body>

<div class="container-fluid login-page">

    <div class="row login-row">


        <!-- =========================
             LOGIN
        ========================== -->

        <div class="col-lg-6">

            <div class="auth-box">

                <span class="small-title">
                    FANDOMVERSE
                </span>

                <h1>
                    Login
                </h1>

                <p class="description">
                    Welcome back to your fandom space.
                </p>


                <form id="loginForm">

                    <!-- Email -->

                    <div class="mb-3">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            class="form-control"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="mb-3">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            class="form-control"
                            placeholder="••••••••"
                            required
                        >

                    </div>


                    <!-- Login -->

                    <button
                        type="submit"
                        class="auth-button login-button"
                    >
                        Login
                    </button>

                </form>

                <div id="loginMessage"></div>

            </div>

        </div>



        <!-- =========================
             SIGN UP
        ========================== -->

        <div class="col-lg-6">

            <div class="auth-box">

                <span class="small-title">
                    NEW HERE?
                </span>

                <h1>
                    Sign Up
                </h1>

                <p class="description">
                    Create your profile and start saving your favorite
                    fandoms.
                </p>


                <form id="signupForm">


                    <!-- First Name + Username -->

                    <div class="row">

                        <div class="col-md-6">

                            <div class="mb-3">

                                <label>
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    id="firstName"
                                    class="form-control"
                                    required
                                >

                            </div>

                        </div>


                        <div class="col-md-6">

                            <div class="mb-3">

                                <label>
                                    Username
                                </label>

                                <input
                                    type="text"
                                    id="username"
                                    class="form-control"
                                    required
                                >

                            </div>

                        </div>

                    </div>


                    <!-- Email -->

                    <div class="mb-3">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            id="signupEmail"
                            class="form-control"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="mb-3">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            id="signupPassword"
                            class="form-control"
                            required
                        >

                    </div>


                    <!-- Sign Up -->

                    <button
                        type="submit"
                        class="auth-button signup-button"
                    >
                        Create Account
                    </button>

                </form>

                <div id="signupMessage"></div>

            </div>

        </div>

    </div>

</div>


<script>

    /* =========================
       LOGIN
    ========================== */

    document.getElementById("loginForm").addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            let email =
                document.getElementById("loginEmail").value.trim();

            let password =
                document.getElementById("loginPassword").value.trim();

            let savedEmail =
                localStorage.getItem("fandomEmail");

            let savedPassword =
                localStorage.getItem("fandomPassword");


            if (
                email === savedEmail &&
                password === savedPassword
            ) {

                localStorage.setItem(
                    "fandomLoggedIn",
                    "true"
                );

                document.getElementById(
                    "loginMessage"
                ).innerHTML = `
                    <div class="success-message">
                        Login successful!
                    </div>
                `;

                setTimeout(function() {

                    window.location.href = "index.html";

                }, 1000);

            } else {

                document.getElementById(
                    "loginMessage"
                ).innerHTML = `
                    <div class="error-message">
                        Invalid email or password.
                    </div>
                `;

            }

        }
    );


    /* =========================
       SIGN UP
    ========================== */

    document.getElementById("signupForm").addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            let firstName =
                document.getElementById("firstName").value.trim();

            let username =
                document.getElementById("username").value.trim();

            let email =
                document.getElementById("signupEmail").value.trim();

            let password =
                document.getElementById("signupPassword").value.trim();


            /* Save account */

            localStorage.setItem(
                "fandomName",
                firstName
            );

            localStorage.setItem(
                "fandomUsername",
                username
            );

            localStorage.setItem(
                "fandomEmail",
                email
            );

            localStorage.setItem(
                "fandomPassword",
                password
            );


            document.getElementById(
                "signupMessage"
            ).innerHTML = `
                <div class="success-message">
                    Account created successfully!
                </div>
            `;


            /* Clear form */

            document.getElementById(
                "signupForm"
            ).reset();


            /* Put email into login */

            document.getElementById(
                "loginEmail"
            ).value = email;

        }
    );

</script>

</body>
</html>
